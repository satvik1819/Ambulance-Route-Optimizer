[project]
name = "ambulance-route-optimizer"
version = "2.0.0"
description = "Dark-mode Gradio emergency route and hospital selection academic prototype"
requires-python = ">=3.10"
dependencies = [
  "gradio>=5.0,<7.0",
  "pandas>=2.0,<3.0",
  "requests>=2.31,<3.0",
  "folium>=0.16,<1.0",
  "python-dotenv>=1.0,<2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
